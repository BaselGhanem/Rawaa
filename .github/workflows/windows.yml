name: Rawaa Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'src/windows.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors) { $errors | Format-List | Out-Host; exit 1 }
      - name: Build installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Rawaa-Windows-x64
          path: |
            dist/Rawaa-Setup-*.exe
            dist/Rawaa-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Rawaa-Windows-x64
          path: release
      - name: Publish installer and updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          test -s release/latest.yml
          test -s "release/Rawaa-Setup-$version.exe"
          test -s "release/Rawaa-Setup-$version.exe.blockmap"
          grep -Fx "version: $version" release/latest.yml
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --generate-notes
