name: Rawaa Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'src/windows.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors) { $errors | Format-List | Out-Host; exit 1 }
      - name: Build installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Rawaa-Windows-x64
          path: |
            dist/Rawaa-Setup-*.exe
            dist/Rawaa-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Rawaa-Windows-x64
          path: release
      - name: Publish installer and updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          test -s release/latest.yml
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
