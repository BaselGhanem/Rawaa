<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رواء | Rawaa</title>
<link rel="stylesheet" href="../node_modules/@fontsource/almarai/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/almarai/700.css">
<link rel="stylesheet" href="../node_modules/@phosphor-icons/web/src/regular/style.css">
<link rel="stylesheet" href="style.css">
<script defer src="ui.js"></script>
</head>
<body>
<main id="shell" class="shell">
  <header class="brand">
    <button id="spaces" class="mark" title="تحكم برواء · اسحب لنقله" aria-label="تحكم برواء" aria-haspopup="dialog"><img src="rawaa.png" alt="" draggable="false"></button>
    <button id="space-name" class="wordmark"><strong>رواء</strong><span id="current-space"></span></button>
  </header>
  <section class="search-wrap">
    <button id="search-icon" class="search-icon" aria-label="بحث"><i class="ph ph-magnifying-glass"></i></button>
    <input id="search" type="search" autocomplete="off" placeholder="ابحث في اختصاراتك" aria-label="ابحث في اختصاراتك">
  </section>
  <div id="entries" class="entries"><div id="entry-list"></div></div>
  <footer class="footer">
    <button id="add" aria-label="اضافة عنصر" class="row foot-row" data-tip="اضافة عنصر"><i class="ph ph-plus-circle"></i><span>اضافة عنصر</span></button>
    <button id="shelf-button" class="row foot-row" aria-label="رف الملفات" data-tip="رف الملفات" hidden><i class="ph ph-tray"></i><span>رف الملفات</span><small id="shelf-count" class="tail"></small></button>
    <button id="settings" aria-label="الاعدادات" class="row foot-row" data-tip="الاعدادات"><i class="ph ph-gear"></i><span>الاعدادات</span></button>
    <section id="clock-calendar" class="clock-calendar" aria-label="التقويم" hidden></section>
    <button id="date" aria-controls="clock-calendar" aria-expanded="false" class="row clock" data-tip="التقويم"><span class="clock-face"><span class="clock-reading" dir="ltr"><strong id="time"></strong><small id="clock-period"></small></span><small id="date-label"></small></span><i class="ph ph-calendar-blank tail"></i></button>
  </footer>
  <section id="sheet" class="sheet" hidden></section>
</main>
<button id="edge-handle" aria-label="فتح رواء من الحافة" aria-controls="shell" hidden></button>
<div id="tip" role="tooltip" hidden></div>
<div id="toast" role="status" hidden></div>
</body>
</html>
